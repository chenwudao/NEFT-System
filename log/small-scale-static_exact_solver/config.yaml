  battery_safety_margin: 1.15
  charge_load_weight_m: 8000.0
  charge_queue_weight_m: 2000.0
  composite_weights:
    priority: 1.0
    urgency: 1.5
    load: 0.3
    distance: 1.0
    scale_distance: 10000.0
    urgency_window: 7200.0
  sa:
    iterations: 1500
    t_start: 1000.0
    t_end: 1.0
    alpha_reward: 2.0
    seed: 42
fleet:
  small_count: 2
  medium_count: 1
  large_count: 0
  station_count: 1
vehicle:
  small:
    max_battery: 60.0
    max_load: 500.0
    unit_energy_consumption: 0.00025
    speed: 10.0
    charging_power: 0.015
  medium:
    max_battery: 100.0
    max_load: 1500.0
    unit_energy_consumption: 0.0003
    speed: 10.0
    charging_power: 0.022
  large:
    max_battery: 150.0
    max_load: 5000.0
    unit_energy_consumption: 0.0004
    speed: 8.0
    charging_power: 0.03
charging_station:
  default_capacity: 2
  max_queue_time: 600
task:
  initial_tasks: 3
  generation_interval_sec_min: 15
  generation_interval_sec_max: 40
  generation_batch_min: 1
  generation_batch_max: 2
  max_pending_tasks: 8
  min_weight: 10.0
