# 中规模配置：6 辆车 / 2 充电站 / 中等任务流量
experiment:
  name: "medium-scale-relay_handoff"
  log_dir: "log"

optimization:
  mode: "dynamic"   # dynamic | static
  static:
    strategy: "static_exact_solver"
    solver: "gurobi"      # gurobi | cplex（未安装会自动回退）
    max_exact_tasks: 10

fleet:
  small_count:   2
  medium_count:  3
  large_count:   1
  station_count: 2

charging_station:
  default_capacity: 3
  max_queue_time:   600

vehicle:
  small:
    unit_energy_consumption: 0.001  
    max_battery: 60.0
  medium:
    unit_energy_consumption: 0.0015 
    max_battery: 100.0
  large:
    unit_energy_consumption: 0.002
    max_battery: 150.0


task:
  generation_seed_file: "F:/Data Structure/NEFT-System-main/NEFT-System/log/benchmarks/dynamic/medium/seed_1/composite_score/task_generation_seed.yaml"
  initial_tasks:               5
  generation_interval_sec_min: 5
  generation_interval_sec_max: 15
  generation_batch_min:        2
  generation_batch_max:        4
  max_pending_tasks:           20
  min_weight:           10.0
  max_weight:           500.0
  min_priority:         1
  max_priority:         5
  min_deadline_offset:  1800
  max_deadline_offset:  7200
  total_task_budget:    80

scheduling:
  strategy:              "relay_handoff"
  low_battery_pct:       20.0
  charge_until_pct:      90.0
  battery_safety_margin: 1.15
  charge_load_weight_m:  8000.0
  charge_queue_weight_m: 2000.0
  composite_weights:
    priority:       1.0
    urgency:        1.5
    load:           0.3
    distance:       1.0
    scale_distance: 10000.0
    urgency_window: 3600.0

simulation:
  speed_factor:    120
  tick_interval:   1.0
  # 任务生成截止时间，仿真秒（到达后停止生成新任务，但仿真继续直到所有任务结算）
  max_sim_seconds: 7200
  marker_tween_ms: 900
  marker_tween_adaptive: true
  stop_when_all_tasks_done: true

scoring:
  # 默认评分参数（与当前系统原始默认值一致）
  task_assign_reward: 120.0
  priority_reward: 30.0
  distance_penalty: 0.02
  early_completion_reward_per_min: 2.0
  overdue_penalty_per_min: 50.0
  idle_penalty: 5.0
  assumed_speed_mps: 10.0
  urgent_deadline_window: 1800
  max_deadline_window: 7200
