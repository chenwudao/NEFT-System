# 中规模：6 辆车 / 2 充电站 / 中等任务流量

experiment:
  name: "medium-scale-relay_handoff"
  log_dir: "log"

optimization:
  mode: "dynamic"

fleet:
  small_count:   2
  medium_count:  3
  large_count:   1
  station_count: 2

task:

  initial_tasks:               5
  generation_interval_sec_min: 5
  generation_interval_sec_max: 15
  generation_batch_min:        5
  generation_batch_max:        10
  max_pending_tasks:           20
  total_task_budget:           80

scheduling:
  strategy: "relay_handoff"
  relay_handoff:
    proximity_threshold_m: 1500   # 两车路网距离低于此值（米）可协商接力

simulation:
  max_sim_seconds: 7200
