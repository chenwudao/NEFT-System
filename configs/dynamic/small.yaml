# 小规模：3 辆车 / 1 充电站 / 任务流量小
# 未写出的字段沿用 backend/config.py 默认值（车型、评分、仿真 tick 等）。

experiment:
  name: "small-scale-nearest-baseline"
  log_dir: "log"

optimization:
  mode: "dynamic"

fleet:
  small_count:   2
  medium_count:  1
  large_count:   0
  station_count: 1

charging_station:
  default_capacity: 2

task:
  generation_seed_file: NULL
  initial_tasks:               3
  generation_interval_sec_min: 5
  generation_interval_sec_max: 15
  generation_batch_min:        2
  generation_batch_max:        4
  max_pending_tasks:           5
  total_task_budget:           20

scheduling:
  strategy: "nearest_task"

simulation:
  max_sim_seconds: 3600
