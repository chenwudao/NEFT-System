# 中规模（静态上帝视角）

experiment:
  name: "medium-scale-static_exact_solver"
  log_dir: "log"

optimization:
  mode: "static"
  static:
    strategy: "nearest_task"
    solver: "heuristic"
    force_gurobi_only: false
    accept_feasible_when_force_gurobi_only: false
    objective_mode: "proxy"
    charge_time_penalty_per_s: 0.02
    charge_event_penalty: 20.0
    charge_queue_penalty: 40.0
    avg_charge_detour_m: 1200.0
    unserved_penalty: 420.0
    soc_min_ratio: 0.0
    heuristic_time_limit_s: 5.0
    heuristic_ls_rounds: 220
    heuristic_seed: 20260527
    exact_assignment_time_limit_s: 2.0
    max_exact_tasks: 10
    strict_global_optimum: false
    mip_gap_threshold: 0.02
    time_limit_s: null
    live_gap_log: true
    live_gap_log_interval_s: 2.0
    max_lateness_s: 7200
    gurobi_tuning:
      mip_focus: 1
      heuristics: 0.25
      cuts: 2
      presolve: 2
      threads: 0

fleet:
  small_count:   2
  medium_count:  3
  large_count:   1
  station_count: 2

task:
  generation_seed_file: "F:/Data Structure/NEFT-System-main/NEFT-System/log/medium-scale-composite_score/task_generation_seed.yaml"
  initial_tasks:               5
  generation_interval_sec_min: 5
  generation_interval_sec_max: 15
  generation_batch_min:        2
  generation_batch_max:        4
  max_pending_tasks:           20
  total_task_budget:           80

scheduling:
  strategy: "nearest_task"

simulation:
  max_sim_seconds: 7200
