experiment:
  name: large-seed1-priority_task
  log_dir: experiments/dynamic_benchmark/large/seed_1/runs
optimization:
  mode: dynamic
fleet:
  small_count: 3
  medium_count: 5
  large_count: 1
  station_count: 3
charging_station:
  default_capacity: 4
  max_queue_time: 900
task:
  generation_seed_file: null
  initial_tasks: 8
  generation_interval_sec_min: 5
  generation_interval_sec_max: 15
  generation_batch_min: 5
  generation_batch_max: 10
  max_pending_tasks: 30
  total_task_budget: 80
scheduling:
  strategy: priority_task
  charge_load_weight_m: 10000.0
  charge_queue_weight_m: 3000.0
simulation:
  speed_factor: 120
  max_sim_seconds: 11800
